<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Open Positions | MEXCBOT</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#07111f;
      --panel:#0d1b2d;
      --panel2:#10243a;
      --border:#1d3550;
      --text:#e8f0f8;
      --muted:#8ea4ba;
      --green:#35d07f;
      --red:#ff6678;
      --blue:#5aa9ff;
      --gold:#f5c451;
      --shadow:0 18px 50px rgba(0,0,0,.24);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:linear-gradient(180deg,#07111f 0%,#091827 100%);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    .shell{width:min(1440px,100%);margin:auto;padding:16px}
    header{
      display:flex;align-items:center;justify-content:space-between;
      gap:12px;margin-bottom:18px;flex-wrap:wrap
    }
    .brand h1{margin:0;font-size:22px;letter-spacing:-.02em}
    .brand p{margin:5px 0 0;color:var(--muted);font-size:13px}
    nav{display:flex;gap:7px;overflow:auto;padding-bottom:3px}
    nav a{
      color:var(--muted);text-decoration:none;padding:9px 12px;
      border:1px solid var(--border);border-radius:10px;white-space:nowrap
    }
    nav a.active{color:var(--text);background:var(--panel2)}
    .toolbar{
      display:flex;gap:10px;align-items:center;flex-wrap:wrap;
      margin-bottom:16px
    }
    select,button{
      border:1px solid var(--border);background:var(--panel);
      color:var(--text);border-radius:10px;padding:10px 12px;font:inherit
    }
    button{cursor:pointer}
    button:hover{background:var(--panel2)}
    .refresh{margin-left:auto}
    .stats{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;margin-bottom:16px
    }
    .stat,.card{
      background:linear-gradient(145deg,var(--panel),#0b1727);
      border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)
    }
    .stat{padding:14px}
    .stat span{display:block;color:var(--muted);font-size:12px}
    .stat strong{display:block;margin-top:6px;font-size:21px}
    .grid{display:grid;gap:14px}
    .card{padding:16px}
    .card-head{
      display:flex;justify-content:space-between;gap:10px;
      align-items:flex-start;margin-bottom:15px
    }
    .symbol{font-size:18px;font-weight:750}
    .cycle{color:var(--muted);font-size:12px;margin-top:4px}
    .badge{
      border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700;
      background:rgba(53,208,127,.12);color:var(--green)
    }
    .metrics{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px
    }
    .metric{padding:11px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.018)}
    .metric label{display:block;color:var(--muted);font-size:11px}
    .metric b{display:block;margin-top:5px;font-size:14px;word-break:break-word}
    .protection{
      display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px
    }
    .protect{padding:12px;border-radius:12px;border:1px solid var(--border)}
    .protect.tp{background:rgba(53,208,127,.06)}
    .protect.sl{background:rgba(255,102,120,.06)}
    .protect small{display:block;color:var(--muted)}
    .protect strong{display:block;font-size:16px;margin-top:4px}
    .tp strong{color:var(--green)}
    .sl strong{color:var(--red)}
    .progress{margin-top:13px}
    .progress-top{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
    .bar{height:7px;background:#15283c;border-radius:99px;overflow:hidden;margin-top:6px}
    .bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
    .empty{
      text-align:center;padding:48px 18px;color:var(--muted);
      border:1px dashed var(--border);border-radius:16px
    }
    .updated{color:var(--muted);font-size:11px}
    @media(min-width:640px){
      .shell{padding:22px}
      .stats{grid-template-columns:repeat(4,1fr)}
      .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .metrics{grid-template-columns:repeat(3,minmax(0,1fr))}
    }
    @media(min-width:1100px){
      .shell{padding:28px}
      .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <h1>Open Positions</h1>
      <p>Live position, average entry and protected exit levels</p>
    </div>
    <nav>
      <a href="/status">Runtime</a>
      <a href="/orders">Orders</a>
      <a class="active" href="/positions">Positions</a>
      <a href="/cycles">Cycles</a>
      <a href="/config">Config</a>
    </nav>
  </header>

  <div class="toolbar">
    <select id="symbol">
      <option value="">All symbols</option>
      <option>BTCUSDT</option>
      <option>ETHUSDT</option>
      <option>BNBUSDT</option>
      <option>SOLUSDT</option>
      <option>TRXUSDT</option>
    </select>
    <button id="refresh" class="refresh">Refresh</button>
    <span id="updated" class="updated">Waiting for data…</span>
  </div>

  <section class="stats">
    <div class="stat"><span>Open Cycles</span><strong id="count">0</strong></div>
    <div class="stat"><span>Invested USDT</span><strong id="invested">0</strong></div>
    <div class="stat"><span>Asset Quantity</span><strong id="quantity">0</strong></div>
    <div class="stat"><span>Active Symbols</span><strong id="symbols">0</strong></div>
  </section>

  <main id="grid" class="grid">
    <div class="empty">Loading open positions…</div>
  </main>
</div>

<script>
  const grid = document.querySelector("#grid");
  const symbol = document.querySelector("#symbol");
  const updated = document.querySelector("#updated");

  const n = (value, digits=8) =>
    value === null || value === undefined || !Number.isFinite(Number(value))
      ? "—"
      : Number(value).toLocaleString(undefined,{maximumFractionDigits:digits});

  function card(p) {
    const qty = Number(p.position.totalQuantity || 0);
    const progress = Math.min((Number(p.progress.buyFillCount || 0) / 10) * 100, 100);

    return `
      <article class="card">
        <div class="card-head">
          <div>
            <div class="symbol">${p.symbol}</div>
            <div class="cycle">Cycle ${p.cycleNumber} · ID ${p.cycleId}</div>
          </div>
          <span class="badge">${p.status}</span>
        </div>

        <div class="metrics">
          <div class="metric"><label>Quantity</label><b>${n(qty)}</b></div>
          <div class="metric"><label>Invested</label><b>${n(p.position.totalCost,4)} USDT</b></div>
          <div class="metric"><label>Average Entry</label><b>${n(p.position.averagePrice,8)}</b></div>
          <div class="metric"><label>Initial Price</label><b>${n(p.initialPrice,8)}</b></div>
          <div class="metric"><label>BUY Fills</label><b>${p.progress.buyFillCount}</b></div>
          <div class="metric"><label>DCA Fills</label><b>${p.progress.dcaFillCount}</b></div>
        </div>

        <div class="protection">
          <div class="protect tp">
            <small>Take Profit · +${n(p.takeProfit.percentage,2)}%</small>
            <strong>${n(p.takeProfit.price,8)}</strong>
          </div>
          <div class="protect sl">
            <small>Stop Loss · -${n(p.stopLoss.percentage,2)}%</small>
            <strong>${n(p.stopLoss.price,8)}</strong>
          </div>
        </div>

        <div class="progress">
          <div class="progress-top">
            <span>DCA progress</span>
            <span>${p.progress.buyFillCount}/10 BUY fills</span>
          </div>
          <div class="bar"><i style="width:${progress}%"></i></div>
        </div>
      </article>
    `;
  }

  async function load() {
    try {
      const q = symbol.value ? `?symbol=${encodeURIComponent(symbol.value)}` : "";
      const response = await fetch(`/api/positions${q}`, {cache:"no-store"});
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      const positions = data.positions || [];

      document.querySelector("#count").textContent = positions.length;
      document.querySelector("#symbols").textContent =
        new Set(positions.map(p => p.symbol)).size;

      document.querySelector("#invested").textContent =
        n(positions.reduce((sum,p) => sum + Number(p.position.totalCost || 0),0),4);

      document.querySelector("#quantity").textContent =
        n(positions.reduce((sum,p) => sum + Number(p.position.totalQuantity || 0),0));

      grid.innerHTML = positions.length
        ? positions.map(card).join("")
        : '<div class="empty">No open positions found.</div>';

      updated.textContent = `Updated ${new Date().toLocaleTimeString()}`;
    } catch (error) {
      grid.innerHTML = `<div class="empty">Unable to load positions: ${error.message}</div>`;
      updated.textContent = "Update failed";
    }
  }

  document.querySelector("#refresh").addEventListener("click", load);
  symbol.addEventListener("change", load);
  load();
  setInterval(load, 5000);
</script>
</body>
</html>
